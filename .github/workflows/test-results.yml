---
name: Test Results

# yamllint disable-line rule:truthy
on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

permissions: {}

jobs:
  publish:
    name: Publish Bats test results
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: Download validation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dclint-validation-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Detect JUnit reports
        id: reports
        shell: bash
        run: |
          test -f artifacts/event.json
          shopt -s nullglob globstar
          reports=(artifacts/**/*.xml)
          if ((${#reports[@]} > 0)); then
            printf '%s\n' 'found=true' >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' 'found=false' >> "${GITHUB_OUTPUT}"
            printf '%s\n' 'No JUnit reports were produced by the validation run.'
          fi

      - name: Publish test results
        if: steps.reports.outputs.found == 'true'
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/**/*.xml
          check_name: Bats Test Results
          comment_title: Bats Test Results
          comment_mode: ${{ github.event.workflow_run.event == 'pull_request' && 'always' || 'off' }}
