---
name: Versioning

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release descriptor
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calculate-version.outputs.version-string }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate version
        id: calculate-version
        uses: bitshifted/git-auto-semver@c4e8f005e839f822325356f141939cf6c76b5701 # v1
        with:
          create_tag: false
          initial_version: 0.1.0
          tag_prefix: v

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats
          bats --version

      - name: Run behavior tests
        run: make test

      - name: Validate maintained descriptor
        run: make validate

      - name: Build exact release descriptor
        run: |
          make build \
            VERSION="${{ steps.calculate-version.outputs.version-string }}" \
            BUILD_REF="${{ github.sha }}"

      - name: Validate exact release descriptor
        run: |
          make validate-release \
            VERSION="${{ steps.calculate-version.outputs.version-string }}" \
            BUILD_REF="${{ github.sha }}"
          make integration-test \
            VERSION="${{ steps.calculate-version.outputs.version-string }}" \
            BUILD_REF="${{ github.sha }}"

      - name: Validate release file set
        shell: bash
        run: |
          expected=(
            dclint.megalinter-descriptor.yml
            dclint.megalinter-descriptor.yml.sha256
          )
          shopt -s nullglob
          actual=(dist/*)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -f "dist/${file}"
          done
          cd dist
          sha256sum -c dclint.megalinter-descriptor.yml.sha256

      - name: Upload validated release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dclint-release-files
          path: |
            dist/dclint.megalinter-descriptor.yml
            dist/dclint.megalinter-descriptor.yml.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated release
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dclint-release-files
          path: dist

      - name: Re-verify transferred release files
        shell: bash
        run: |
          expected=(
            dclint.megalinter-descriptor.yml
            dclint.megalinter-descriptor.yml.sha256
          )
          shopt -s nullglob
          actual=(dist/*)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -f "dist/${file}"
          done
          cd dist
          sha256sum -c dclint.megalinter-descriptor.yml.sha256

      - name: Create release from validated bytes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          name: "v${{ needs.validate.outputs.version }}"
          tag_name: "v${{ needs.validate.outputs.version }}"
          target_commitish: "${{ github.sha }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/dclint.megalinter-descriptor.yml
            dist/dclint.megalinter-descriptor.yml.sha256
