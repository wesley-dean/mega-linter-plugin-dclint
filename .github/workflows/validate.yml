---
name: Validate

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  event_file:
    name: Preserve validation event
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Upload source event
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dclint-validation-event
          path: ${{ github.event_path }}
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Behavior and plugin validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats
          bats --version

      - name: Check Bash syntax
        run: |
          bash -n tests/megalinter.bash
          bash -n tests/validate.bash

      - name: Run TAP behavior tests
        run: make test

      - name: Validate development descriptor
        run: make validate

      - name: Validate generated descriptor
        run: make validate-release BUILD_REF="${SOURCE_COMMIT}"

      - name: Run MegaLinter integration tests
        run: make integration-test BUILD_REF="${SOURCE_COMMIT}"

      - name: Upload test results
        if: (!cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dclint-validation-test-results
          path: test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 7
